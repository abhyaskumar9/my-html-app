name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -r index.html style.css script.js www/ 2>/dev/null || cp index.html www/

      - name: Install Dependencies
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Sign APK with Debug Keystore
        run: |
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk
          $BUILD_TOOLS/zipalign -v -p 4 $APK_PATH aligned.apk
          $BUILD_TOOLS/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --out my-app-signed.apk aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-signed
          path: my-app-signed.apk
